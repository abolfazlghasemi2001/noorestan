<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دوئل آیه‌ساز | نورستان</title><link rel="stylesheet" href="games/common.css">
<style>.duel-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.score{display:flex;gap:8px;margin:12px 0}.score .chip{flex:1}.vs{text-align:center;color:var(--gold2);font-weight:900}.round{text-align:center;color:var(--mut);font-size:13px;margin:12px}.arena{min-height:220px}.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.tile{font-family:var(--f-q);font-size:23px;padding:8px 14px;border:1px solid var(--edge);border-radius:14px;color:var(--txt);background:rgba(255,255,255,.08);cursor:pointer}.tile:disabled{opacity:.45;cursor:default}.tile.ok{background:rgba(61,220,151,.2);border-color:var(--grn)}.status{text-align:center;color:var(--mut);line-height:2;margin:14px 0}.code{font-size:30px;letter-spacing:6px;color:var(--gold2);text-align:center;font-weight:900}.row{display:flex;gap:8px}.row>*{flex:1}.error{color:var(--red);min-height:24px;text-align:center}</style></head>
<body><main class="wrap"><div class="duel-top"><a class="btn-ghost" href="games/">→ بازی‌ها</a><div class="title">دوئل آیه‌ساز</div></div><section class="score"><div class="chip"><b id="you">۰</b><small id="youName">تو</small></div><div class="vs">VS</div><div class="chip"><b id="opp">۰</b><small id="oppName">حریف</small></div></section><section class="card arena"><div class="round" id="round">برای شروع، حریف پیدا کن</div><div class="status" id="status">دو نفر، یک آیه، داوری کاملاً سمت سرور.</div><div class="tiles" id="tiles"></div><div class="error" id="error"></div></section><section class="card" id="lobby"><div class="row"><button class="btn" id="queue">حریف تصادفی</button><button class="btn-ghost" id="make">ساخت کد خصوصی</button></div><div class="row" style="margin-top:8px"><input class="btn-ghost" id="joinCode" inputmode="numeric" maxlength="4" placeholder="کد حریف"><button class="btn-ghost" id="join">ورود به کد</button></div><div class="code" id="code"></div></section></main>
<script>(()=>{const $=s=>document.querySelector(s),fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);let ws=null,match='',round=0,locked=false,my=0,his=0;const set=(s,v)=>$(s).textContent=v,say=s=>set('#status',s),err=s=>set('#error',s||''),send=m=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({ns:'noorestan',...m}))};const connect=()=>{const p=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${p}://${location.host}`);ws.onopen=()=>send({t:'hello',name:'بازیکن',level:1,score:0});ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}handle(m)};ws.onclose=()=>{say('اتصال قطع شد؛ دوباره امتحان کن');locked=true}};function handle(m){if(m.t==='welcome')return;if(m.t==='authenticated')return say('آماده‌ای. یک حریف انتخاب کن.');if(m.t==='duel:waiting'){locked=true;set('#code',m.code?`کد: ${m.code}`:'در صف جست‌وجوی حریف…');return say('منتظر حریف هستیم…')}if(m.t==='duel:start'){match=m.match;my=his=0;set('#youName',m.you.name);set('#oppName',m.opp.name);return say('دوئل شروع شد!')}if(m.t==='duel:round'){round=m.round;locked=false;set('#round',`دور ${fa(m.round)} از ${fa(m.total)} · سوره ${fa(m.s)} · آیه ${fa(m.a)}`);const box=$('#tiles');box.innerHTML='';m.tiles.forEach(t=>{const b=document.createElement('button');b.className='tile';b.textContent=t.t;b.onclick=()=>{if(locked)return;send({t:'duel:pick',round,id:t.id})};box.appendChild(b)})}if(m.t==='duel:ok'){say(`پیشرفت تو: ${fa(m.n)} از ${fa(m.of)}`);if(m.n===m.of)locked=true}if(m.t==='duel:opp')say('حریف در حال چیدن آیه است…');if(m.t==='duel:bad')say(`اشتباه! ${fa(Math.ceil(m.ms/1000))} ثانیه قفل شد`);if(m.t==='duel:locked')say('کمی صبر کن…');if(m.t==='duel:roundEnd'){set('#you',fa(m.you));set('#opp',fa(m.opp));say(m.won?'این دور را بردی!':m.lost?'این دور را باختی.':'این دور مساوی شد.')}if(m.t==='duel:end'){locked=true;say(m.result==='win'?'🏆 بردی!':m.result==='lose'?'این بار حریف برد.':'مساوی شد.');set('#round','دوئل تمام شد')}if(m.t==='duel:error')err(m.msg);if(m.t==='duel:cancelled')say('لغو شد.')}const act=t=>{connect();setTimeout(()=>send({t}),300)};$('#queue').onclick=()=>act('duel:queue');$('#make').onclick=()=>act('duel:code');$('#join').onclick=()=>{connect();setTimeout(()=>send({t:'duel:join',code:$('#joinCode').value}),300)}})();</script></body></html>
