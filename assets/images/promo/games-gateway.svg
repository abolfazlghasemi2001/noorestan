  <g class="card c2" transform="translate(251 204)"><rect width="138" height="132" rx="30" fill="#111a35" stroke="url(#green)" stroke-width="4"/><image href="../../../games/art/hadith-rush.svg" x="22" y="16" width="94" height="82"/><text x="69" y="116" text-anchor="middle" fill="#c7ffe9" font-family="Vazirmatn,Tahoma" font-size="20" font-weight="800">باران حکمت</text></g>
