<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="بازی‌های نورستان">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#182657"/><stop offset=".62" stop-color="#0b1230"/><stop offset="1" stop-color="#070b18"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset=".55" stop-color="#f5c451"/><stop offset="1" stop-color="#a66b05"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ff0c0"/><stop offset="1" stop-color="#259f78"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%"><stop offset="0" stop-color="#fff3bd" stop-opacity=".9"/><stop offset=".5" stop-color="#f5c451" stop-opacity=".22"/><stop offset="1" stop-color="#f5c451" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <style>@media (prefers-reduced-motion:no-preference){.orb{animation:float 4s ease-in-out infinite}.o2{animation-delay:.6s}.o3{animation-delay:1.2s}.ray{animation:pulse 2.6s ease-in-out infinite}.card{animation:rise .9s cubic-bezier(.22,1,.36,1) both}.c2{animation-delay:.12s}.c3{animation-delay:.24s}@keyframes float{50%{transform:translateY(-14px)}}@keyframes pulse{50%{opacity:.32;transform:scale(1.04)}}@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}}</style>
  </defs>
