<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<title>آیه‌ساز — نورستان</title>
<link rel="stylesheet" href="common.css">
<style>
.ref{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--mut);font-size:13px}
.ref b{color:var(--gold)}
.timer{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:14px}
.timer i{display:block;height:100%;width:100%;background:var(--grad);transform-origin:right;transition:transform .1s linear}
.timer.low i{background:linear-gradient(90deg,#ff5d73,#ff8a5c)}
.slot{min-height:110px;border:1.5px dashed rgba(245,201,106,.35);border-radius:18px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;direction:rtl;background:rgba(0,0,0,.18);margin-bottom:14px}
.slot:empty::before{content:"واژه‌ها را به ترتیبِ درست بزن";color:var(--mut);font-size:13px;margin:auto}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:60px}
.tile{font-family:var(--f-q);font-size:24px;line-height:1.9;padding:4px 14px;border-radius:14px;border:1px solid var(--edge);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));color:var(--txt);cursor:pointer;transition:transform .25s var(--bounce),box-shadow .25s,opacity .25s;user-select:none;animation:pp .4s var(--bounce) both}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(245,201,106,.18)}
.tile.placed{background:linear-gradient(180deg,rgba(61,220,151,.22),rgba(61,220,151,.08));border-color:rgba(61,220,151,.5);cursor:default;animation:pp .35s var(--bounce)}
.tile.hint{box-shadow:0 0 0 2px var(--gold),0 0 26px rgba(245,201,106,.7);animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 2px var(--gold2),0 0 40px rgba(245,201,106,.95)}}
.tile.wrong{border-color:var(--red);background:rgba(255,93,115,.18)}
.done{font-family:var(--f-q);font-size:26px;line-height:2.1;text-align:center;color:var(--gold2);text-shadow:0 0 24px rgba(245,201,106,.4)}
.row{display:flex;gap:10px;margin-top:14px}
.row .btn,.row .btn-ghost{flex:1}
.combo{position:absolute;top:12px;left:14px;font-weight:900;color:var(--gold2);font-size:15px;opacity:0;transition:.3s}
.combo.on{opacity:1;animation:pp .4s var(--bounce)}
.lvl{display:flex;gap:8px;justify-content:center;margin:14px 0}
.lvl button{flex:1}
.lvl button.sel{border-color:var(--gold);color:var(--gold2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="./">→ بازی‌ها</a><div class="title">آیه‌ساز</div><button class="btn-ghost" id="mute">🔊</button></div>
  <div class="hud">
    <div class="chip"><b id="score">۰</b><small>امتیاز</small></div>
    <div class="chip"><b id="round">۰/۰</b><small>مرحله</small></div>
    <div class="chip"><div class="hearts" id="hearts"></div><small>جان</small></div>
  </div>
  <div class="card" id="board">
    <div class="combo" id="combo"></div>
    <div class="ref"><span>سوره <b id="surah">—</b></span><span>آیهٔ <b id="ayah">—</b></span></div>
    <div class="timer" id="timer"><i></i></div>
    <div class="slot" id="slot"></div>
    <div class="pool" id="pool"></div>
    <div class="row"><button class="btn-ghost" id="hint">💡 راهنما (−۵۰)</button><button class="btn-ghost" id="skip">⏭ رد شو</button></div>
  </div>
</div>

<div class="overlay on" id="start"><div class="card">
  <div class="big">آیه‌ساز</div>
  <p class="mut">واژه‌های آیه به هم ریخته‌اند. پیش از تمام شدن زمان، به ترتیبِ درست بچینشان.<br>هر چه سریع‌تر و پیاپی‌تر، امتیاز بیشتر. متن آیه‌ها از مرجعِ عثمانیِ خودِ نورستان خوانده می‌شود.</p>
  <div class="lvl" id="lvl">
    <button class="btn-ghost sel" data-l="1">🌱 آسان</button>
    <button class="btn-ghost" data-l="2">🌿 متوسط</button>
    <button class="btn-ghost" data-l="3">🔥 دشوار</button>
  </div>
  <button class="btn" id="go" style="width:100%">شروع</button>
  <p class="mut" id="bestTxt" style="margin-top:10px"></p>
</div></div>

<div class="overlay" id="end"><div class="card">
  <div class="mut" id="endTitle">پایان</div>
  <div class="big" id="endScore">۰</div>
  <p class="mut" id="endInfo"></p>
  <div class="row"><button class="btn" id="again">دوباره</button><a class="btn-ghost" href="./" style="display:flex;align-items:center;justify-content:center">بازی‌ها</a></div>
</div></div>

<script src="common.js"></script>
<script>
(() => {
  const SURAH = {1:'فاتحه',2:'بقره',3:'آل عمران',4:'نساء',5:'مائده',24:'نور',33:'احزاب',59:'حشر',96:'علق',97:'قدر',99:'زلزله',102:'تکاثر',103:'عصر',107:'ماعون',108:'کوثر',109:'کافرون',110:'نصر',112:'اخلاص',113:'فلق',114:'ناس'};
  const LV = { 1: { maxTiles: 5, rounds: 8, secPer: 4.5 }, 2: { maxTiles: 7, rounds: 10, secPer: 3.4 }, 3: { maxTiles: 10, rounds: 12, secPer: 2.6 } };
  const MARK = /^[\u06D6-\u06ED\u06DE\u06E9]+$/;
  let hiddenAt = 0, BANK = [], lv = 1, Q = [], qi = 0, score = 0, life = 3, combo = 0, best = 0, cur = null, need = 0, tEnd = 0, tTotal = 0, raf = 0, solvedN = 0, mistakes = 0;

  const el = G.$;
  const prep = (key, text) => {
    const [s, a] = key.split(':').map(Number);
    let w = text.trim().split(/\s+/);
    if (a === 1 && s !== 1 && G.norm(w[0]) === 'بسم') w = w.slice(4); // بسمله‌ای که API به آیهٔ اول چسبانده
    const full = w.join(' ');
    w = w.filter(x => !MARK.test(x));
    return { s, a, full, words: w };
  };
  const chunk = (words, n) => {
    if (words.length <= n) return words.slice();
    const out = [], size = words.length / n;
    for (let i = 0; i < n; i++) out.push(words.slice(Math.round(i * size), Math.round((i + 1) * size)).join(' '));
    return out.filter(Boolean);
  };

  const load = async () => {
    try {
      const r = await fetch('../_quran-ref.json', { cache: 'force-cache' });
      const j = await r.json();
      BANK = Object.entries(j.ayat).map(([k, v]) => prep(k, v)).filter(x => x.words.length >= 3);
    } catch {
      BANK = [];
    }
    if (!BANK.length) { el('#go').disabled = true; el('#bestTxt').textContent = 'مرجع آیه‌ها بارگذاری نشد. بازی را از روی سرور باز کن، نه از file://'; }
    else showBest();
  };
  const showBest = () => { const b = G.best('ayahbuilder_' + lv).best; el('#bestTxt').textContent = b ? `رکوردِ این سطح: ${G.fa(b)}` : ''; };

  const hud = (broke = false) => {
    el('#score').textContent = G.fa(score);
    el('#round').textContent = `${G.fa(Math.min(qi + 1, Q.length))}/${G.fa(Q.length)}`;
    G.hearts(el('#hearts'), life, 3, broke);
  };

  const start = () => {
    const L = LV[lv];
    // آسان: آیه‌های کوتاه‌تر جلوترند
    const pool = G.shuffle(BANK).sort((x, y) => lv === 1 ? x.words.length - y.words.length : 0);
    Q = pool.slice(0, Math.min(L.rounds, pool.length));
    if (lv !== 1) Q = G.shuffle(Q);
    qi = 0; score = 0; life = 3; combo = 0; solvedN = 0; mistakes = 0;
    el('#start').classList.remove('on'); el('#end').classList.remove('on');
    next();
  };

  const next = () => {
    cancelAnimationFrame(raf);
    if (qi >= Q.length || life <= 0) return finish();
    cur = Q[qi];
    const L = LV[lv];
    cur.tiles = chunk(cur.words, L.maxTiles);
    need = 0;
    el('#surah').textContent = SURAH[cur.s] || G.fa(cur.s);
    el('#ayah').textContent = G.fa(cur.a);
    el('#slot').innerHTML = '';
    const pool = el('#pool'); pool.innerHTML = '';
    let order = G.shuffle(cur.tiles.map((t, i) => ({ t, i })));
    if (order.every((o, k) => o.i === k) && order.length > 1) order.reverse();
    order.forEach((o, k) => {
      const b = document.createElement('button');
      b.className = 'tile'; b.textContent = o.t; b.style.animationDelay = (k * 45) + 'ms';
      b.onclick = () => pick(b, o.t);
      pool.appendChild(b);
    });
    tTotal = (5 + cur.tiles.length * L.secPer) * 1000;
    tEnd = performance.now() + tTotal;
    hud();
    tick();
  };

  const tick = () => {
    const left = tEnd - performance.now();
    const p = Math.max(0, left / tTotal);
    el('#timer i').style.transform = `scaleX(${p})`;
    el('#timer').classList.toggle('low', p < .25);
    if (left <= 0) return timeout();
    raf = requestAnimationFrame(tick);
  };

  const pick = (b, t) => {
    if (b.classList.contains('placed')) return;
    if (t === cur.tiles[need]) {
      G.sfx.tap(); need++;
      b.classList.remove('hint');
      b.classList.add('placed');
      el('#slot').appendChild(b);
      if (need === cur.tiles.length) solved();
    } else {
      G.sfx.bad(); G.buzz(60); mistakes++;
      b.classList.add('wrong'); setTimeout(() => b.classList.remove('wrong'), 400);
      G.reshake(el('#board'));
      combo = 0; showCombo();
      tEnd -= 2500; // جریمهٔ زمانی، نه جان — تا بازی از اشتباه کوچک نترساند
    }
  };

  const solved = () => {
    cancelAnimationFrame(raf);
    const left = Math.max(0, tEnd - performance.now());
    combo++; solvedN++;
    const gain = Math.round((100 + left / tTotal * 150) * (1 + (combo - 1) * .25) * lv);
    score += gain;
    const r = el('#slot').getBoundingClientRect();
    G.burst(r.left + r.width / 2, r.top + r.height / 2, 36);
    G.sfx.ok(); G.buzz(25);
    showCombo();
    el('#slot').innerHTML = `<div class="done pop" style="width:100%">${cur.full}</div>`;
    G.toast(`+${G.fa(gain)}  ${combo > 1 ? '🔥 ترکیبِ ' + G.fa(combo) : ''}`, 1400);
    qi++; hud();
    setTimeout(next, 1700);
  };

  const timeout = () => {
    cancelAnimationFrame(raf);
    life--; combo = 0; showCombo();
    G.sfx.bad(); G.buzz([80, 40, 80]);
    hud(true);
    el('#slot').innerHTML = `<div class="done pop" style="width:100%;color:var(--mut)">${cur.full}</div>`;
    el('#pool').innerHTML = '';
    G.toast('⏱ زمان تمام شد — پاسخ درست را ببین', 1600);
    qi++;
    setTimeout(next, 2100);
  };

  const showCombo = () => { const c = el('#combo'); if (combo > 1) { c.textContent = `🔥 ×${G.fa(combo)}`; c.classList.remove('on'); void c.offsetWidth; c.classList.add('on'); } else c.classList.remove('on'); };

  const hint = () => {
    if (!cur || need >= cur.tiles.length) return;
    if (score < 50) return G.toast('برای راهنما دست‌کم ۵۰ امتیاز لازم است');
    score -= 50; hud();
    const want = cur.tiles[need];
    const b = [...el('#pool').children].find(x => x.textContent === want && !x.classList.contains('placed'));
    if (b) { b.classList.add('hint'); G.sfx.tap(); }
  };

  const finish = () => {
    cancelAnimationFrame(raf);
    const r = G.best('ayahbuilder_' + lv, score);
    el('#endTitle').textContent = life > 0 ? 'آفرین! همهٔ آیه‌ها را چیدی' : 'جان‌ها تمام شد';
    el('#endScore').textContent = G.fa(score);
    el('#endInfo').innerHTML = `${G.fa(solvedN)} آیه از ${G.fa(Q.length)} · ${G.fa(mistakes)} اشتباه<br>${r.isNew ? '🏆 رکورد تازه!' : 'رکورد: ' + G.fa(r.best)}`;
    el('#end').classList.add('on');
    if (r.isNew || life > 0) { G.sfx.win(); G.confetti(); }
  };

  el('#lvl').onclick = e => { const b = e.target.closest('button'); if (!b) return; lv = +b.dataset.l; [...el('#lvl').children].forEach(x => x.classList.toggle('sel', x === b)); showBest(); };
  el('#go').onclick = start;
  el('#again').onclick = () => { el('#end').classList.remove('on'); el('#start').classList.add('on'); showBest(); };
  el('#hint').onclick = hint;
  el('#skip').onclick = () => { if (cur && need < cur.tiles.length) timeout(); };
  const mb = el('#mute'); const sm = () => mb.textContent = G.muted() ? '🔇' : '🔊'; sm();
  mb.onclick = () => { try { localStorage.setItem('noorestan_g_mute', G.muted() ? '0' : '1'); } catch {} sm(); };
  document.addEventListener('visibilitychange', () => {
    const live = cur && need < cur.tiles.length && !el('#end').classList.contains('on') && !el('#start').classList.contains('on');
    if (document.hidden) { cancelAnimationFrame(raf); hiddenAt = performance.now(); }
    else if (live && hiddenAt) { tEnd += performance.now() - hiddenAt; hiddenAt = 0; tick(); } // زمانِ پس‌زمینه حساب نمی‌شود
  });
  load();
})();
</script>
</body>
</html>
