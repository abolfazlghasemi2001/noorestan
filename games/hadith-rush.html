<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<title>باران حکمت — نورستان</title>
<link rel="stylesheet" href="common.css">
<style>
.prompt{text-align:center}
.prompt .ar{font-family:var(--f-q);font-size:22px;line-height:2.1;color:var(--txt)}
.prompt .ar u{text-decoration:none;display:inline-block;min-width:70px;border-bottom:2px solid var(--gold);color:var(--gold2);margin:0 4px}
.prompt .fa{color:var(--mut);font-size:13px;line-height:1.9;margin-top:6px;transition:opacity .3s}
.prompt .src{color:var(--gold);font-size:11px;opacity:.8;margin-top:6px}
.arena{position:relative;height:min(46vh,380px);margin-top:12px;border-radius:22px;overflow:hidden;border:1px solid var(--edge);background:linear-gradient(180deg,rgba(36,48,107,.35),rgba(7,11,24,.6))}
.arena::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),rgba(255,255,255,.05) calc(25% - 1px) 25%)}
.floor{position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,transparent,var(--red),transparent);opacity:.6}
.orb{position:absolute;top:0;width:calc(25% - 10px);margin:0 5px;padding:10px 4px;border-radius:18px;text-align:center;font-family:var(--f-q);font-size:19px;line-height:1.6;color:#fff;cursor:pointer;user-select:none;background:radial-gradient(120% 120% at 50% 0%,rgba(255,223,145,.35),rgba(122,162,255,.18) 60%,rgba(255,255,255,.05));border:1px solid rgba(255,223,145,.45);box-shadow:0 0 22px rgba(245,201,106,.25),inset 0 1px 0 rgba(255,255,255,.25);will-change:transform;word-break:break-word}
.orb.hit{animation:hit .45s var(--ease) forwards}
@keyframes hit{to{transform:var(--t) scale(1.6);opacity:0;filter:brightness(2)}}
.orb.miss{animation:miss .45s forwards;border-color:var(--red);background:rgba(255,93,115,.3)}
@keyframes miss{to{transform:var(--t) rotate(18deg) scale(.6);opacity:0}}
.orb.reveal{border-color:var(--grn);box-shadow:0 0 30px rgba(61,220,151,.8)}
.lvlup{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:var(--gold2);text-shadow:0 0 30px rgba(245,201,106,.8);pointer-events:none;opacity:0}
.lvlup.on{animation:lu 1.2s var(--ease)}
@keyframes lu{0%{opacity:0;transform:scale(.5)}25%{opacity:1;transform:scale(1.1)}80%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
.tog{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0;color:var(--mut);font-size:13px}
.tog input{accent-color:var(--gold);width:18px;height:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="./">→ بازی‌ها</a><div class="title">باران حکمت</div><button class="btn-ghost" id="mute">🔊</button></div>
  <div class="hud">
    <div class="chip"><b id="score">۰</b><small>امتیاز</small></div>
    <div class="chip"><b id="level">۱</b><small>سطح</small></div>
    <div class="chip"><b id="combo">×۱</b><small>ترکیب</small></div>
    <div class="chip"><div class="hearts" id="hearts"></div><small>جان</small></div>
  </div>
  <div class="card prompt" id="board">
    <div class="ar" id="ar">—</div>
    <div class="fa" id="fa"></div>
    <div class="src" id="src"></div>
  </div>
  <div class="arena" id="arena"><div class="floor"></div><div class="lvlup" id="lvlup"></div></div>
</div>

<div class="overlay on" id="start"><div class="card">
  <div class="big">باران حکمت</div>
  <p class="mut">یک واژه از حدیث افتاده. چهار گزینه از آسمان می‌بارند؛ پیش از رسیدن واژهٔ درست به زمین، بزنش.<br>هر پنج پاسخ درست، باران تندتر می‌شود.</p>
  <label class="tog"><input type="checkbox" id="hard"> حالت استاد: ترجمه پنهان (امتیاز ×۲)</label>
  <button class="btn" id="go" style="width:100%">شروع</button>
  <p class="mut" id="bestTxt" style="margin-top:10px"></p>
</div></div>

<div class="overlay" id="end"><div class="card">
  <div class="mut">باران بند آمد</div>
  <div class="big" id="endScore">۰</div>
  <p class="mut" id="endInfo"></p>
  <div style="display:flex;gap:10px;margin-top:14px"><button class="btn" id="again" style="flex:1">دوباره</button><a class="btn-ghost" href="./" style="flex:1;display:flex;align-items:center;justify-content:center">بازی‌ها</a></div>
</div></div>

<script src="common.js"></script>
<script src="../hadith-bank.js"></script>
<script>
(() => {
  const el = G.$;
  // فقط حدیث‌هایی که واژهٔ کلیدی‌شان واقعاً در متن پیدا می‌شود (بی‌اعراب سنجیده می‌شود)
  const BANK = (typeof HADITH_BANK !== 'undefined' ? HADITH_BANK : []).map(h => {
    const words = h.ar.split(/\s+/), nk = G.norm(h.key);
    const idx = words.findIndex(w => G.norm(w) === nk);
    if (idx < 0 || !h.wrong || h.wrong.length < 3) return null;
    return { ...h, words, idx };
  }).filter(Boolean);

  let hard = false, score = 0, life = 3, combo = 0, level = 1, right = 0, total = 0, speed = 0, orbs = [], cur = null, raf = 0, last = 0, busy = false, deck = [], hiddenAt = 0;

  const hud = (broke = false) => {
    el('#score').textContent = G.fa(score);
    el('#level').textContent = G.fa(level);
    el('#combo').textContent = '×' + G.fa(1 + Math.floor(combo / 3));
    G.hearts(el('#hearts'), life, 3, broke);
  };
  const showBest = () => { const b = G.best('hadithrush').best; el('#bestTxt').textContent = b ? `رکورد: ${G.fa(b)}` : ''; };
  if (!BANK.length) { el('#go').disabled = true; el('#bestTxt').textContent = 'بانک حدیث بارگذاری نشد.'; } else showBest();

  const start = () => {
    hard = el('#hard').checked;
    score = 0; life = 3; combo = 0; level = 1; right = 0; total = 0;
    deck = G.shuffle(BANK);
    el('#start').classList.remove('on'); el('#end').classList.remove('on');
    hud(); round();
  };

  const round = () => {
    clear();
    if (life <= 0) return finish();
    if (!deck.length) deck = G.shuffle(BANK);
    cur = deck.pop(); busy = false; total++;
    const w = cur.words.slice(); w[cur.idx] = '<u>&nbsp;؟&nbsp;</u>';
    el('#ar').innerHTML = w.join(' ');
    el('#ar').classList.remove('pop'); void el('#ar').offsetWidth; el('#ar').classList.add('pop');
    el('#fa').textContent = hard ? 'ترجمه در حالت استاد پنهان است' : cur.fa;
    el('#fa').style.opacity = hard ? .5 : 1;
    el('#src').textContent = '';
    const opts = G.shuffle([cur.key, ...cur.wrong.slice(0, 3)]);
    const H = el('#arena').clientHeight;
    speed = H / (7.5 * Math.pow(.88, level - 1)); // پیکسل بر ثانیه — هر سطح ۱۲٪ تندتر
    opts.forEach((t, lane) => {
      const o = document.createElement('div');
      o.className = 'orb'; o.textContent = t;
      o.style.right = (lane * 25) + '%';
      const y = -60 - Math.random() * 90;
      const rec = { o, t, y, ok: t === cur.key, dead: false };
      o.style.transform = `translateY(${y}px)`;
      o.onpointerdown = e => { e.preventDefault(); tap(rec); };
      el('#arena').appendChild(o);
      orbs.push(rec);
    });
    last = performance.now();
    raf = requestAnimationFrame(loop);
  };

  const loop = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const H = el('#arena').clientHeight;
    for (const r of orbs) {
      if (r.dead) continue;
      r.y += speed * dt;
      const t = `translateY(${r.y}px)`;
      r.o.style.transform = t; r.o.style.setProperty('--t', t);
      if (r.ok && r.y > H - r.o.offsetHeight) return landed(r);
    }
    raf = requestAnimationFrame(loop);
  };

  const tap = r => {
    if (busy || r.dead) return;
    if (r.ok) {
      busy = true; cancelAnimationFrame(raf);
      combo++; right++;
      const mult = (1 + Math.floor(combo / 3)) * (hard ? 2 : 1);
      const H = el('#arena').clientHeight;
      const gain = Math.round((50 + Math.max(0, 1 - r.y / H) * 100) * mult * (1 + (level - 1) * .2));
      score += gain;
      const b = r.o.getBoundingClientRect();
      G.burst(b.left + b.width / 2, b.top + b.height / 2, 40);
      G.sfx.ok(); G.buzz(25);
      r.o.classList.add('hit'); r.dead = true;
      orbs.forEach(x => { if (!x.dead) { x.o.style.opacity = .25; } });
      reveal(true);
      if (right % 5 === 0) levelUp();
      hud();
      setTimeout(round, 1500);
    } else {
      r.dead = true; r.o.classList.add('miss');
      combo = 0; life--; G.sfx.bad(); G.buzz(70);
      G.reshake(el('#board')); hud(true);
      if (life <= 0) { busy = true; cancelAnimationFrame(raf); reveal(false); setTimeout(finish, 1600); }
    }
  };

  const landed = r => {
    busy = true; cancelAnimationFrame(raf);
    life--; combo = 0; G.sfx.bad(); G.buzz([80, 40, 80]);
    r.o.classList.add('reveal');
    G.reshake(el('#arena')); hud(true);
    reveal(false);
    setTimeout(life > 0 ? round : finish, 1900);
  };

  const reveal = ok => {
    const w = cur.words.slice(); w[cur.idx] = `<u style="border-color:${ok ? 'var(--grn)' : 'var(--red)'}">${cur.words[cur.idx]}</u>`;
    el('#ar').innerHTML = w.join(' ');
    el('#fa').textContent = cur.fa; el('#fa').style.opacity = 1;
    el('#src').textContent = '📚 ' + cur.src;
  };

  const levelUp = () => {
    level++; G.sfx.lvl();
    const l = el('#lvlup'); l.textContent = `سطحِ ${G.fa(level)} ⚡`;
    l.classList.remove('on'); void l.offsetWidth; l.classList.add('on');
  };

  const clear = () => { cancelAnimationFrame(raf); orbs.forEach(r => r.o.remove()); orbs = []; };

  const finish = () => {
    clear();
    const r = G.best('hadithrush', score);
    el('#endScore').textContent = G.fa(score);
    el('#endInfo').innerHTML = `${G.fa(right)} پاسخ درست از ${G.fa(total)} · سطحِ ${G.fa(level)}${hard ? ' · حالت استاد' : ''}<br>${r.isNew ? '🏆 رکورد تازه!' : 'رکورد: ' + G.fa(r.best)}`;
    el('#end').classList.add('on');
    if (r.isNew) { G.sfx.win(); G.confetti(); }
  };

  el('#go').onclick = start;
  el('#again').onclick = () => { el('#end').classList.remove('on'); el('#start').classList.add('on'); showBest(); };
  const mb = el('#mute'); const sm = () => mb.textContent = G.muted() ? '🔇' : '🔊'; sm();
  mb.onclick = () => { try { localStorage.setItem('noorestan_g_mute', G.muted() ? '0' : '1'); } catch {} sm(); };
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(raf); hiddenAt = 1; }
    else if (hiddenAt && orbs.length && !busy) { hiddenAt = 0; last = performance.now(); raf = requestAnimationFrame(loop); }
  });
})();
</script>
</body>
</html>
