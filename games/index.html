<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<title>بازی‌های تازهٔ نورستان</title>
<link rel="stylesheet" href="common.css">
<style>
.hero{text-align:center;margin:6px 0 18px}
.hero p{color:var(--mut);font-size:13px;line-height:1.9}
.g{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;margin-bottom:14px;transition:transform var(--dur-2) var(--bounce);animation:pp .5s var(--bounce) both}
.g:nth-of-type(2){animation-delay:.08s}
.g:hover,.g:focus-visible{transform:translateY(-3px) scale(1.01)}
.g:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.g .ic{width:84px;height:84px;flex:none;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh-gold);transition:transform var(--dur-3) var(--bounce)}
.g .ic img{display:block;width:100%;height:100%}
.g:hover .ic{transform:rotate(-4deg) scale(1.06)}
.g h3{font-size:17px;margin-bottom:var(--sp-1)}
.g p{color:var(--mut);font-size:12.5px;line-height:1.8}
.g .b{display:flex;gap:10px;align-items:center;color:var(--gold);font-size:11px;margin-top:var(--sp-1);min-height:16px}
.g .st{letter-spacing:2px;color:var(--gold2)}
.g .st .off{opacity:.25}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="../">→ نورستان</a><div class="title">بازی‌های تازه</div></div>
  <div class="hero"><p>هر بازی تا ۳ ستاره دارد. رکورد بزن، ستاره جمع کن و نتیجه‌ات را با دوستانت هم‌رسانی کن.</p></div>
  <a class="card g" href="ayah-builder.html"><div class="ic"><img src="art/ayah-builder.svg" alt="" width="84" height="84"></div><div><h3>آیه‌ساز</h3><p>واژه‌های آیه را پیش از تمام شدن زمان، به ترتیب بچین. سه سطح، ترکیب، راهنما.</p><div class="b" id="b1"></div></div></a>
  <a class="card g" href="hadith-rush.html"><div class="ic"><img src="art/hadith-rush.svg" alt="" width="84" height="84"></div><div><h3>باران حکمت</h3><p>واژهٔ گم‌شدهٔ حدیث را از میان گزینه‌های بارانی بگیر. هر سطح تندتر.</p><div class="b" id="b2"></div></div></a>
</div>
<script src="common.js"></script>
<script>
  const starRow = n => '<span class="st">' + [0, 1, 2].map(i => i < n ? '★' : '<span class="off">★</span>').join('') + '</span>';
  const badge = (sel, rec, st) => {
    if (!rec && !st) return;
    G.$(sel).innerHTML = starRow(st) + (rec ? '<span>🏆 رکورد: ' + G.fa(rec) + '</span>' : '');
  };
  const ab = [1, 2, 3].map(l => 'ayahbuilder_' + l);
  badge('#b1', Math.max(...ab.map(k => G.best(k).best)), Math.max(...ab.map(k => G.stars(k))));
  badge('#b2', G.best('hadithrush').best, G.stars('hadithrush'));
</script>
</body>
</html>
