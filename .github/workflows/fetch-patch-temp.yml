name: fetch-patch-temp
on:
  push:
    branches: [arena/01a0de02-noorestan]
    paths: [.github/workflows/fetch-patch-temp.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0de02-noorestan
      - name: Download and verify raw patch
        shell: bash
        run: |
          curl -fsSL --retry 5 --retry-all-errors --max-time 90 -o patch.patch 'https://hoosna1402.ir/patch'
          test "$(wc -c < patch.patch)" -eq 65949
          head -c 11 patch.patch | grep -q '^diff --git '
          sha256sum patch.patch
          wc -c patch.patch
      - name: Commit patch temporarily onto current branch
        run: |
          git config user.name 'arena-ai-coding-agent[bot]'
          git config user.email '298482267+arena-ai-coding-agent[bot]@users.noreply.github.com'
          git add patch.patch
          git commit -m 'Temporarily add downloaded patch'
          git push origin HEAD:arena/01a0de02-noorestan
